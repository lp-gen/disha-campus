<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Disha – Campus Navigator</title>
<meta name="description" content="Disha – smart campus navigation for Manav Rachna">
<meta name="theme-color" content="#2b3bd1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16194a;--brand:#2b3bd1;--brand2:#5b6cff;--accent:#ff9f1c;--bg:#eef1fb;--card:#fff;--muted:#555a78;--line:#e3e6f3;--ok:#1f9d6b;--danger:#e0445a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line);z-index:20}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.3px;white-space:nowrap}
.logo img{width:34px;height:34px}
.logo small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:-3px}
.search{flex:1;position:relative;max-width:560px;margin:0 auto}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);outline:none;font-size:14px}
.search input:focus{border-color:var(--brand2);background:#fff}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.18);overflow:hidden;display:none;max-height:60vh;overflow-y:auto}
#results.on{display:block}
.res{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res:hover,.res.sel{background:var(--bg)}
.res .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.res b{display:block;font-size:14px}.res span{font-size:12px;color:var(--muted)}
.mode{display:flex;background:var(--bg);border-radius:999px;padding:3px;font-size:12px;font-weight:700;flex:none}
.mode button{padding:6px 11px;border-radius:999px;color:var(--muted)}
.mode button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.12)}
body.admin .mode button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:8px;padding:8px 14px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none;z-index:10}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;border:1px solid var(--line)}
.chip:hover{border-color:var(--brand2)}
main{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;background:linear-gradient(#e6f0ff,#f3f8ee 60%);cursor:grab;user-select:none}
#map.grabbing{cursor:grabbing}
.bld{cursor:pointer}
.bld>g{transition:transform .18s}
.bld:hover>g,.bld.target>g{transform:translateY(-6px)}
.bld.target .top{filter:brightness(1.12)}
.lbl{pointer-events:none}
.lbl rect{fill:#fff;stroke:rgba(0,0,0,.12)}
.lbl text{font-size:11px;font-weight:700;fill:var(--ink)}
.lbl.target rect{fill:var(--accent);stroke:none}.lbl.target text{fill:#fff}
.route{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 11;animation:dash 0.8s linear infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.routebg{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
.float{position:absolute;z-index:5}
.here{left:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:#fff;border-radius:999px;padding:8px 14px 8px 10px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.15);display:flex;gap:8px;align-items:center;max-width:calc(100% - 100px)}
.here i{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px rgba(43,59,209,.2);flex:none}
.fabs{right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:11px 15px;font-weight:700;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.fab.pri{background:var(--brand);color:#fff}
.zoom{right:14px;top:14px;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.12);overflow:hidden}
.zoom button{width:38px;height:38px;font-size:20px;font-weight:700}
.zoom button+button{border-top:1px solid var(--line)}
.banner{left:50%;transform:translateX(-50%);top:14px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px;width:min(460px,calc(100% - 80px));box-shadow:0 10px 30px rgba(0,0,0,.3);display:none}
.banner.on{display:block}
.banner .t{display:flex;align-items:center;gap:10px}
.banner .t b{font-size:15px}.banner .t span{font-size:12px;opacity:.75}
.banner .x{margin-left:auto;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);flex:none}
.banner ol{margin:10px 0 0;padding-left:20px;font-size:13px;line-height:1.6;opacity:.92}
.banner ol li::marker{color:var(--accent);font-weight:800}
.banner ol li{transition:opacity .2s}.banner ol li.cur{font-weight:700;color:#fff}.banner ol li.cur::marker{content:'➤  '}
.banner ol{max-height:30vh;overflow-y:auto}
.navopts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:12.5px}
.navopts select{font:inherit;font-size:12.5px;margin-left:4px;padding:5px 8px;border-radius:9px;border:0;background:rgba(255,255,255,.14);color:#fff;max-width:150px}
.navopts select option{color:var(--ink)}
.navopts .tg{display:flex;align-items:center;gap:5px;cursor:pointer}
.navopts .tg input{accent-color:var(--accent)}
.navopts .walk{margin-left:auto;background:var(--accent);color:var(--ink)}
::selection{background:#ffd79a;color:var(--ink)}
input,textarea{caret-color:var(--brand)}
:focus-visible{outline:2.5px solid var(--brand2);outline-offset:2px}
*{scrollbar-color:#c9cee3 transparent;scrollbar-width:thin}
h2,h3,.logo,.stat b{letter-spacing:-.02em}
.tip{left:50%;top:14px;transform:translateX(-50%);background:#fff;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.15);white-space:nowrap;transition:opacity .4s}
/* building view */
.view{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.view.on{transform:none}
.vhead{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}
.back{width:38px;height:38px;border-radius:12px;background:var(--bg);font-size:20px;flex:none}
.sw{width:14px;height:38px;border-radius:6px;flex:none}
.vhead h2{margin:0;font-size:18px;line-height:1.15}.vhead p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:13.5px;white-space:nowrap}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn.dark{background:var(--ink)}
.vbody{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:14px;align-content:start}
@media(max-width:820px){.vbody{grid-template-columns:1fr}}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.floors{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.floors button{padding:7px 13px;border-radius:10px;background:var(--bg);font-weight:700;font-size:13px;flex:none}
.floors button.on{background:var(--ink);color:#fff}
.plan{width:100%;min-width:560px;height:auto;display:block}
.room{cursor:pointer}
.room rect.r{stroke:#fff;stroke-width:3;transition:filter .15s}
.room:hover rect.r{filter:brightness(.95)}
.room.hl rect.r{stroke:var(--accent);stroke-width:4}
.room.sel rect.r{stroke:var(--brand);stroke-width:4}
.room text{pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sec{margin-top:14px}.sec:first-child{margin-top:0}
.sec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
.sec h4 .count{background:var(--bg);border-radius:99px;padding:1px 7px;font-size:11px}
.desc{margin:0;font-size:14px;line-height:1.55}
.facs{display:flex;flex-wrap:wrap;gap:6px}
.facs span{background:var(--bg);border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:600}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.empty{margin:0;font-size:13px;color:var(--muted)}
.note{background:#fff8ec;border:1px solid #ffe2b5;border-radius:12px;padding:9px 11px;font-size:13.5px;margin-bottom:8px;position:relative;line-height:1.45}
.note small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.note .x{top:6px;right:6px;width:20px;height:20px;font-size:12px}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13.5px;resize:vertical;min-height:62px;outline:none;margin:6px 0}
textarea:focus{border-color:var(--brand2)}
.upl{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:9px 13px;border:1.5px dashed var(--brand2);color:var(--brand);border-radius:12px;font-weight:700;font-size:13px;cursor:pointer}
.admin-only{display:none!important}
body.admin .admin-only{display:block!important}
body.admin label.admin-only,body.admin button.admin-only{display:inline-flex!important}
.adminbar{display:none;background:var(--ink);color:#fff;font-size:12.5px;padding:7px 14px;font-weight:600;text-align:center}
body.admin .adminbar{display:block}
.disc{font-size:11.5px;color:var(--muted);margin-top:10px}
/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);max-height:86%;background:#fff;border-radius:24px 24px 0 0;z-index:41;transition:transform .3s cubic-bezier(.3,.7,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:9px auto 0;flex:none}
.shead{display:flex;gap:12px;align-items:center;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.shead .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;flex:none}
.shead h3{margin:0;font-size:18px}.shead p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.shead .close{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:16px;flex:none}
.sbody{overflow-y:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:var(--bg);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:17px}.stat span{font-size:11.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
/* chat */
#chatlog{display:flex;flex-direction:column;gap:8px;min-height:240px}
.msg{max-width:85%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.45}
.msg.bot{background:var(--bg);border-bottom-left-radius:5px}
.msg.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg .row{margin-top:8px}
.chatin{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.chatin input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;outline:none}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sugg button{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:600}
/* qr */
.qrcam{position:relative;aspect-ratio:1;max-height:46vh;margin:0 auto 12px;border-radius:20px;overflow:hidden;background:#11142e}
.qrcam video{width:100%;height:100%;object-fit:cover}
.qrcam .frame{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.9);border-radius:18px}
.qrcam .line{position:absolute;left:18%;right:18%;height:3px;background:var(--accent);animation:scan 2s ease-in-out infinite alternate;top:18%}
@keyframes scan{to{top:82%}}
.qrcam p{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#fff;font-size:12px;opacity:.8;margin:0}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:none;place-items:center;padding:20px}
#lightbox.on{display:grid}
#lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:70;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:640px){
 .logo small{display:none}.logo span.nm{display:none}
 header{gap:8px;padding:8px 10px}
 .fab span{display:none}.fab{padding:13px}
 .vhead .btn span{display:none}
 .zoom{display:none}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="logo"><img src="icon.svg" alt=""><div><span class="nm">Disha</span><small>CampusSaathi · MRIIRS</small></div></div>
  <div class="search">
   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
   <input id="q" placeholder="Search blocks, rooms, labs…" autocomplete="off">
   <div id="results"></div>
  </div>
  <div class="mode"><button id="mStu" class="on">Student</button><button id="mAdm">Admin</button></div>
 </header>
 <div class="adminbar">✏️ Admin mode — tap any building or room to add notes &amp; photos</div>
 <div class="chips" id="chips"></div>
 <main id="main">
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="float tip" id="tip">👆 Tap any block to explore its floors</div>
  <div class="float banner" id="banner"></div>
  <div class="float zoom"><button id="zin">+</button><button id="zout">−</button><button id="zfit" style="font-size:14px">⤢</button></div>
  <div class="float here" id="here"><i></i><span id="hereTxt">You are here: Main Gate</span></div>
  <div class="float fabs">
   <button class="fab" id="qrBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 12h8"/></svg><span>Scan QR</span></button>
   <button class="fab pri" id="chatBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Ask Disha</span></button>
  </div>

  <section class="view" id="bview">
   <div class="vhead">
    <button class="back" id="bBack">←</button>
    <div class="sw" id="bSw"></div>
    <div style="min-width:0"><h2 id="bName"></h2><p id="bSub"></p></div>
    <button class="btn" id="bGo" style="margin-left:auto"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg><span>Directions</span></button>
   </div>
   <div class="vbody">
    <div class="card">
     <div class="floors" id="floors"></div>
     <div style="overflow-x:auto;margin:0 -4px"><svg class="plan" id="plan"></svg></div>
     <div class="legend" id="legend"></div>
    </div>
    <div class="card" id="binfo"></div>
   </div>
  </section>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet"><div class="grab"></div><div id="sheetIn" style="display:flex;flex-direction:column;min-height:0"></div></section>
 </main>
</div>
<div id="lightbox" role="dialog" aria-label="Photo"></div>
<div class="toast" id="toast"></div>

<script>
/* =================== DATA =================== */
const TYPES={
 class:{label:'Classroom',fill:'#dfe8ff',icon:'🏫',fac:['Projector','Smart board','Wi-Fi','Fans'],cap:60,desc:'Lecture classroom used for theory sessions.'},
 lab:{label:'Laboratory',fill:'#d8f3e3',icon:'🧪',fac:['Lab equipment','Safety kit','Wi-Fi'],cap:30,desc:'Practical lab — carry your lab record and ID card.'},
 comp:{label:'Computer Lab',fill:'#d4f0f7',icon:'💻',fac:['60 PCs','AC','Projector','LAN + Wi-Fi'],cap:60,desc:'Computer lab for programming practicals.'},
 office:{label:'Office',fill:'#fff0cf',icon:'🗂️',fac:['Help desk','Wi-Fi'],cap:8,desc:'Staff office. Working hours 9:30 AM – 4:30 PM.'},
 wash:{label:'Washroom',fill:'#e9e9f1',icon:'🚻',fac:['Separate M / F','Drinking water nearby'],cap:0,desc:'Washrooms, cleaned every 2 hours.'},
 stairs:{label:'Stairs / Lift',fill:'#ececec',icon:'🪜',fac:['Fire exit route'],cap:0,desc:'Vertical circulation core.'},
 library:{label:'Library',fill:'#efe2ff',icon:'📖',fac:['Books','Reading tables','Wi-Fi','AC'],cap:80,desc:'Library space — maintain silence.'},
 hall:{label:'Hall',fill:'#ffe1e1',icon:'🎭',fac:['Stage','Sound system','AC','Projector'],cap:200,desc:'Seminar / event hall.'},
 food:{label:'Food',fill:'#ffe8d3',icon:'🍽️',fac:['Veg & Non-veg','UPI accepted','RO water'],cap:120,desc:'Food & beverages.'},
 med:{label:'Medical',fill:'#ffdbe6',icon:'🩺',fac:['First aid','Nurse on duty','Ambulance on call'],cap:6,desc:'Medical support for students and staff.'},
 sport:{label:'Sports',fill:'#d3f2cc',icon:'⚽',fac:['Floodlights','Equipment on ID card'],cap:40,desc:'Sports facility, open 6 AM – 8 PM.'},
};
const R=(n,t,w=1,i='')=>({n,t,w,i});
const acad=(L,n)=>Array.from({length:n},(_,f)=>({
 top:[R('Stairs','stairs',.6),R(`${L}-${f}01`,'class'),R(`${L}-${f}02`,'class'),R(`${L}-${f}03`,f%2?'comp':'lab'),R('Washroom','wash',.6)],
 bot:[R('Lift','stairs',.6),R(`${L}-${f}04`,'class'),R(`${L}-${f}05`,'class'),R(f?'Faculty Room':'Department Office','office'),f==n-1?R('Seminar Hall','hall'):R(`${L}-${f}06`,'class')]}));
const B=[

 const d=r.len<0.01?'':`M${pts(ps.map(p=>P(...p))).replace(/ /g,' L')}`;
 document.getElementById('routeL').innerHTML=d?`<path class="routebg" d="${d}"/><path class="route" d="${d}"/>`:'';

 drawPins();
 const steps=[{t:`Start at <b>${esc(nodeName(here))}</b>`,at:0}];let acc=0,run=0;
 for(let i=1;i<ps.length;i++){const L=dist(ps[i-1],ps[i]);acc+=L;run+=L;if(i<ps.length-1){const a=P(...ps[i-1]),c=P(...ps[i]),e=P(...ps[i+1]);const v1=[c[0]-a[0],c[1]-a[1]],v2=[e[0]-c[0],e[1]-c[1]];
   const cr=(v1[0]*v2[1]-v1[1]*v2[0])/(Math.hypot(...v1)*Math.hypot(...v2)||1);if(Math.abs(cr)>.35){steps.push({t:`Walk ${Math.round(acc*M_PER_UNIT)} m, then turn <b>${cr>0?'right':'left'}</b>`,at:run});acc=0}}}
 if(r.len>=0.01)steps.push({t:`Walk ${Math.round(acc*M_PER_UNIT)} m to the <b>${esc(b.short)}</b> entrance${roomId?'':' 🎯'}`,at:run});
 indoorSteps(roomId).forEach(t=>steps.push({t,at:run+1e-6}));

 <ol id="steps">${steps.map((s,i)=>`<li data-i="${i}">${s.t}</li>`).join('')}</ol>`;

 sfree.onchange=e=>{stepFree=e.target.checked;navigate(id,roomId)};
 walkBtn.onclick=()=>walk(ps,steps,r.len);
 if(r.len<0.01){toast(`You're already at ${b.short}`);return}

 fit({x:Math.min(...xs)-pad,y:Math.min(...ys)-pad-60,w:Math.max(...xs)-Math.min(...xs)+pad*2,h:Math.max(...ys)-Math.min(...ys)+pad*2+60});
}

 const cum=[0];for(let i=1;i<ps.length;i++)cum.push(cum[i-1]+dist(ps[i-1],ps[i]));const dur=Math.min(9000,2500+len*350),t0=performance.now();

  <div class="sbody">${T.cap?`<div class="stats"><div class="stat"><b>${T.cap}</b><span>Capacity</span></div><div class="stat"><b>${r.f==0?'G':r.f}</b><span>Floor</span></div><div class="stat"><b>${r.id.split(':')[2].padStart(2,'0')}</b><span>Room no.</span></div></div>`:''}
  <div class="sec"><h4>Facilities</h4><div class="facs">${T.fac.map(f=>`<span>${f}</span>`).join('')}</div></div><div class="sec" id="rmeta"></div>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="navigate('${b.id}','${id}')">🧭 Directions to this room</button><button class="btn ghost" onclick="shareRoom('${id}')">🔗 Share</button></div></div>`);
  metaEditor(document.getElementById('rmeta'),'r:'+id,r.i||T.desc,render)};render()}
function shareRoom(id){const r=findRoom(id),t=`${r.n} — ${BY[r.b].short}, ${floorName(r.f)} (via Disha)`;if(navigator.share)navigator.share({title:'Disha',text:t}).catch(()=>{});else{navigator.clipboard?.writeText(t);toast('Copied to clipboard')}}

/* =================== SEARCH =================== */
const INDEX=[];B.forEach(b=>{INDEX.push({k:'b',id:b.id,label:b.name,sub:b.sub,icon:'🏢',fill:b.color+'33',s:(b.name+' '+b.short+' '+b.sub+' block '+b.id).toLowerCase()});
 b.floors.forEach(f=>f.rooms.forEach(r=>{if(r.t=='stairs')return;const T=TYPES[r.t];INDEX.push({k:'r',id:r.id,b:b.id,label:r.n,sub:`${T.label} · ${b.short}, ${floorName(r.f)}`,icon:T.icon,fill:T.fill,s:(r.n+' '+T.label+' '+b.short+' '+r.t).toLowerCase()})}))});
function search(q){q=q.toLowerCase().trim();if(!q)return[];const ws=q.split(/\s+/);
 return INDEX.map(e=>{let sc=0;ws.forEach(w=>{if(e.label.toLowerCase()==q)sc+=10;if(e.label.toLowerCase().startsWith(w))sc+=4;if(e.s.includes(w))sc+=2});if(!ws.every(w=>e.s.includes(w)))sc=0;if(e.k=='b')sc+=.5;return[sc,e]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1])}
const qi=document.getElementById('q'),res=document.getElementById('results');
function pick(e){res.classList.remove('on');qi.value='';qi.blur();hideTip();if(e.k=='b')openBuilding(e.id);else{const r=findRoom(e.id);openBuilding(r.b,r.f,e.id)}}
qi.oninput=()=>{const r=search(qi.value).slice(0,8);res.innerHTML=r.map((e,i)=>`<div class="res" data-i="${i}"><div class="ic" style="background:${e.fill}">${e.icon}</div><div><b>${esc(e.label)}</b><span>${esc(e.sub)}</span></div></div>`).join('')||(qi.value?'<div class="res"><span>No matches — try “lab”, “D-201”, “library”</span></div>':'');res.classList.toggle('on',!!qi.value);res.querySelectorAll('.res[data-i]').forEach(el=>el.onclick=()=>pick(r[+el.dataset.i]))};
qi.onkeydown=e=>{if(e.key=='Enter'){const r=search(qi.value);if(r[0])pick(r[0])}if(e.key=='Escape'){res.classList.remove('on');qi.blur()}};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search'))res.classList.remove('on')});
const CHIPS=[['🍽️ Canteen',()=>openBuilding('CAN')],['📖 Library',()=>openBuilding('LIB')],['🩺 Medical Room',()=>openBuilding('MAIN',0,'MAIN:0:6')],['🗂️ Admissions',()=>openBuilding('MAIN',0,'MAIN:0:1')],['💼 Placement Cell',()=>openBuilding('MAIN',1,'MAIN:1:2')],['🚻 Washrooms',()=>{qi.value='washroom';qi.oninput();qi.focus()}],['⚽ Sports',()=>openBuilding('FB')],['🦷 Dental OPD',()=>openBuilding('DEN',0,'DEN:0:1')]];
chips.innerHTML=CHIPS.map((c,i)=>`<button class="chip" data-i="${i}">${c[0]}</button>`).join('');chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{hideTip();CHIPS[+b.dataset.i][1]()});

/* =================== QR =================== */
let stream=null,scanTimer=null;
qrBtn.onclick=async()=>{
 openSheet(`<div class="shead"><div class="ic" style="background:#e6e9ff">📷</div><div><h3>Scan location QR</h3><p>QR codes are placed at every block entrance</p></div><button class="close" onclick="closeSheet()">✕</button></div>
 <div class="sbody"><div class="qrcam"><video id="vid" playsinline muted></video><div class="frame"></div><div class="line"></div><p id="qrMsg">Point at a Disha QR code</p></div>
 <h4 style="margin:6px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Demo: simulate a scan at</h4>
 <div class="sugg">${['gate',...B.filter(b=>!b.flat).map(b=>'d_'+b.id)].map(k=>`<button onclick="scanned('${k}')">${esc(nodeName(k))}</button>`).join('')}</div></div>`,stopCam);
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=document.getElementById('vid');v.srcObject=stream;await v.play();
  if('BarcodeDetector' in window){const bd=new BarcodeDetector({formats:['qr_code']});scanTimer=setInterval(async()=>{try{const c=await bd.detect(v);if(c[0]){const m=c[0].rawValue.match(/disha:(\w+)/i);if(m){const k=m[1]=='gate'?'gate':'d_'+m[1].toUpperCase();if(N[k])scanned(k)}}}catch(e){}},400)}}
 catch(e){const m=document.getElementById('qrMsg');if(m)m.textContent='Camera unavailable — use a demo scan below'}};
function stopCam(){clearInterval(scanTimer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function scanned(k){closeSheet();setHere(k);toast('📍 Location set: '+nodeName(k));const p=P(...N[k]);if(!routeTo)fit({x:p[0]-300,y:p[1]-220,w:600,h:420})}

/* =================== CHATBOT =================== */
const FAQ=[
 [/(library).*(time|timing|open|hour|close)|(time|timing|hour).*(library)/i,'📖 The Central Library is open 8:00 AM – 8:00 PM (Mon–Sat). Carry your ID card; bags go in the locker at the entrance.','LIB'],
 [/canteen|food|eat|lunch|hungry|snack|breakfast/i,'🍽️ The Canteen is on the west side of campus, between Block D and Block C. Open 8 AM – 7 PM, UPI accepted.','CAN'],
 [/wash ?room|toilet|restroom|bathroom/i,'🚻 Every academic block has washrooms next to the staircase on each floor.',null],
 [/wi-?fi|internet|network/i,'📶 Connect to the campus Wi-Fi and log in with your enrolment number. For issues, visit the Student Help Desk in the Main Building.','MAIN'],
 [/medical|doctor|sick|first aid|nurse|injur/i,'🩺 The Medical Room is on the ground floor of the Main Building (MRIIRS), next to Accounts.','MAIN'],
 [/fee|admission|scholarship|bonafide|certificate|id card/i,'🗂️ Admissions, fees and certificates are handled on the ground floor of the Main Building. 9:30 AM – 4:30 PM.','MAIN'],
 [/placement|internship|job|recruit/i,'💼 The Placement Cell is on the 1st floor of the Main Building.','MAIN'],
 [/dental|teeth|tooth|opd/i,'🦷 Manav Rachna Dental College OPD is on its ground floor — north-east of campus.','DEN'],
 [/sport|football|basketball|gym|play/i,'⚽ The Football Ground and Basketball Court are inside the oval loop road, west-centre of campus.','FB'],
 [/^(hello|hi|hey|namaste|hii+)\b/i,'Namaste! 👋 I’m Disha. Ask me where anything is — e.g. “Where is D-201?” or “Library timings”.',null],
];
let chatHist=[];
function chatAnswer(q){for(const [re,a,b] of FAQ)if(re.test(q))return{t:a,b};
 const clean=q.replace(/where|is|the|how|to|reach|find|go|can|i|a|an|\?|please|room|of/gi,' ').trim();const r=search(clean)[0];
 if(r){if(r.k=='b')return{t:`🏢 <b>${esc(r.label)}</b> — ${esc(r.sub)}. Tap below to see it or get directions.`,b:r.id};const rm=findRoom(r.id);return{t:`📍 <b>${esc(r.label)}</b> is a ${esc(r.sub)}.`,b:rm.b,room:r.id}}
 return{t:'Sorry, I don’t know that yet 🙈. Try asking about a block, a room number, the library, canteen, medical room or fees.'}}
function chatRender(){const log=document.getElementById('chatlog');if(!log)return;log.innerHTML=chatHist.map(m=>`<div class="msg ${m.me?'me':'bot'}">${m.t}${m.b?`<div class="row"><button class="btn sm" onclick="${m.room?`openBuilding('${m.b}',${findRoom(m.room).f},'${m.room}')`:`openBuilding('${m.b}')`};">Show</button><button class="btn sm ghost" onclick="navigate('${m.b}'${m.room?`,'${m.room}'`:''})">🧭 Directions</button></div>`:''}</div>`).join('');log.parentElement.scrollTop=1e6}
chatBtn.onclick=()=>{if(!chatHist.length)chatHist.push({t:'Hi! I’m <b>Disha</b> 🧭 your campus guide. Ask me anything about Manav Rachna campus.'});
 openSheet(`<div class="shead"><div class="ic" style="background:#2b3bd1;color:#fff">🤖</div><div><h3>Ask Disha</h3><p>AI campus assistant</p></div><button class="close" onclick="closeSheet()">✕</button></div>
 <div class="sbody"><div id="chatlog"></div><div class="sugg" style="margin-top:12px">${['Library timings','Where is the canteen?','Medical room','Where is D-203?','Fee payment','Placement cell'].map(s=>`<button onclick="ask('${s}')">${s}</button>`).join('')}</div></div>
 <form class="chatin" onsubmit="event.preventDefault();ask(this.q.value);this.q.value=''"><input name="q" placeholder="Ask about campus…" autocomplete="off"><button class="btn">Send</button></form>`);chatRender()};
function ask(q){if(!q.trim())return;chatHist.push({me:1,t:esc(q)});chatRender();setTimeout(()=>{const a=chatAnswer(q);chatHist.push(a);chatRender()},450)}

/* =================== MODE / MISC =================== */
mStu.onclick=()=>{document.body.classList.remove('admin');mStu.classList.add('on');mAdm.classList.remove('on')};
mAdm.onclick=()=>{document.body.classList.add('admin');mAdm.classList.add('on');mStu.classList.remove('on');toast('Admin mode: add notes & photos')};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2000)}
document.addEventListener('keydown',e=>{if(e.key=='Escape'){if(sheet.classList.contains('on'))closeSheet();else bview.classList.remove('on')}});
renderMap();fit();setTimeout(hideTip,6000);
const at=new URLSearchParams(location.search).get('at');if(at){const k=at=='gate'?'gate':'d_'+at.toUpperCase();if(N[k])setHere(k)}
if('serviceWorker' in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
